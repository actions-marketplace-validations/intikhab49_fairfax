name: stale sources

# Fails when a cited Microsoft page hasn't been re-checked for 90 days,
# so the dataset can't quietly go out of date.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: fairfax facts --stale 90
