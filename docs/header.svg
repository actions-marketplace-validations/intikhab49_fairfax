<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340"
     viewBox="0 0 1200 340" role="img"
     aria-label="fairfax: check a GCC, GCC High or Azure Government plan before you build it.
     187 facts from Microsoft's own tables, every finding cited.">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFB020"/>
      <stop offset="55%" stop-color="#FF6B4A"/>
      <stop offset="100%" stop-color="#FF4E88"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF6B4A" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0A0A14" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0 L0 0 0 28" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="340" fill="#0A0A14"/>
  <rect width="1200" height="340" fill="url(#grid)"/>
  <circle cx="1040" cy="70" r="240" fill="url(#fade)"/>

  <text x="64" y="86" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" letter-spacing="3.5" fill="#A3E635">MICROSOFT GOV CLOUD
        &#183; AVAILABILITY CHECK</text>

  <text x="60" y="164" font-family="Georgia,'Times New Roman',serif" font-size="68" font-weight="700"
        fill="url(#grad)">fairfax</text>

  <text x="64" y="204" font-family="-apple-system,Segoe UI,Helvetica,sans-serif" font-size="19" fill="#E8E8F0">Check a GCC, GCC High or Azure
        Government plan before you build it.</text>
  <text x="64" y="232" font-family="-apple-system,Segoe UI,Helvetica,sans-serif" font-size="19" fill="#8B8BA7">Every finding cites the Microsoft
        row it came from.</text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">
    <rect x="64" y="262" width="99" height="28" rx="14" fill="none" stroke="#FFB020" stroke-opacity="0.55"/>
    <text x="113" y="281" fill="#FFB020" text-anchor="middle">187 FACTS</text>
    <rect x="175" y="262" width="123" height="28" rx="14" fill="none" stroke="#A3E635" stroke-opacity="0.55"/>
    <text x="236" y="281" fill="#A3E635" text-anchor="middle">55 ENDPOINTS</text>
    <rect x="310" y="262" width="188" height="28" rx="14" fill="none" stroke="#5B9BFF" stroke-opacity="0.55"/>
    <text x="404" y="281" fill="#5B9BFF" text-anchor="middle">15 MICROSOFT SOURCES</text>
    <rect x="510" y="262" width="50" height="28" rx="14" fill="none" stroke="#FF4E88" stroke-opacity="0.55"/>
    <text x="535" y="281" fill="#FF4E88" text-anchor="middle">MIT</text>
  </g>

  <g>
    <rect x="750" y="64" width="404" height="184" rx="10" fill="#12121F" stroke="#8B8BA7" stroke-opacity="0.35"/>
    <text x="768" y="94" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" fill="#E8E8F0" font-weight="400">$ fairfax check plan.yaml</text>
    <text x="768" y="116" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" fill="#FF6B4A" font-weight="700">BLOCKED (4)</text>
    <text x="768" y="138" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" fill="#E8E8F0" font-weight="400">x defender-for-cloud/ai-services</text>
    <text x="768" y="160" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" fill="#E8E8F0" font-weight="400">x power-automate/actionable-approval-emails</text>
    <text x="768" y="182" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" fill="#E8E8F0" font-weight="400">x power-automate/mobile-ios</text>
    <text x="768" y="204" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" fill="#E8E8F0" font-weight="400">x sentinel/connector/teams</text>
    <text x="768" y="226" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" fill="#A3E635" font-weight="400">4 blocked &#183; 6 ok &#183; every line cited</text>
  </g>
</svg>
