[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fairfax"
dynamic = ["version"]
description = "Check a Microsoft gov-cloud plan (GCC, GCC High, DoD, Azure Government) against Microsoft's own availability tables, from Azure to Microsoft 365 Copilot. Scan code for wrong-cloud hosts and decode AADSTS errors. Every finding cites the row it came from."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["PyYAML>=6"]
authors = [{name = "Intikhab Azam"}]
keywords = ["gcc-high", "gcc", "dod", "azure-government", "government-cloud", "microsoft-365", "microsoft-365-copilot", "teams", "purview", "intune", "feature-availability", "cloud-parity", "sentinel", "defender", "power-platform", "azure-openai", "aadsts", "endpoints", "mcp-server", "github-action", "sarif", "fedramp", "linter"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://intikhab49.github.io/fairfax/"
Documentation = "https://github.com/intikhab49/fairfax#readme"
"Availability tables" = "https://intikhab49.github.io/fairfax/availability/"
Repository = "https://github.com/intikhab49/fairfax"
Issues = "https://github.com/intikhab49/fairfax/issues"
Changelog = "https://github.com/intikhab49/fairfax/releases"

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
fairfax = "fairfax.cli:main"

[tool.setuptools.dynamic]
version = {attr = "fairfax.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fairfax = ["data/*.yaml"]
